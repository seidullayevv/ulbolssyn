<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Биология ҰБТ тест</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#17231f;--mut:#5b6a64;--line:#d9e0db;--acc:#1d6b57;--on:#fff;--sel:#e1f0ea;--ok:#17703a;--okb:#e2f4e7;--bad:#b3261e;--badb:#fbe8e6;--wn:#a85d00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1512;--card:#18211d;--ink:#e8efeb;--mut:#9fb0a8;--line:#2b3a34;--acc:#4cc2a0;--on:#06231a;--sel:#173a30;--ok:#6fd48a;--okb:#16301f;--bad:#ff8a80;--badb:#3a1a18;--wn:#ffb74d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1512;--card:#18211d;--ink:#e8efeb;--mut:#9fb0a8;--line:#2b3a34;--acc:#4cc2a0;--on:#06231a;--sel:#173a30;--ok:#6fd48a;--okb:#16301f;--bad:#ff8a80;--badb:#3a1a18;--wn:#ffb74d;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
#app{max-width:640px;margin:0 auto;padding:0 14px 110px}
h1{font-size:32px;line-height:1.2;margin:44px 0 4px}.mut{color:var(--mut)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 0;background:var(--bg)}
.tm{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--acc)}.tm.wn{color:var(--wn)}.tm.bad{color:var(--bad)}
.cnt{flex:1;color:var(--mut);font-size:14px}
.lnk{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;font-weight:600}
.strip{position:relative;display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.chip{flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.chip.done{background:var(--sel);border-color:var(--acc)}.chip.cur{background:var(--acc);color:var(--on);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.sec{font-size:13px;color:var(--mut);margin-bottom:8px}.qt{font-size:18px;font-weight:600;margin:0 0 12px}
.fig{background:#fff;border-radius:12px;padding:8px;margin:0 0 12px;text-align:center}.fig img{max-width:100%;height:auto}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;margin:0 0 8px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;min-height:48px}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--mut);display:grid;place-items:center;font-size:13px}
.opt.sel{border-color:var(--acc);background:var(--sel)}.opt.sel b{background:var(--acc);color:var(--on);border-color:var(--acc)}
.gt{font-weight:600;margin:14px 0 8px}.hint{font-size:14px;color:var(--mut);margin-bottom:10px}.hint:empty{display:none}.hint.wn{color:var(--wn);font-weight:600}
details{margin:0 0 12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}summary{font-weight:600}
.foot{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:20}.foot .btn{flex:1;max-width:300px}
.btn{border:0;border-radius:12px;padding:14px 18px;font:inherit;font-weight:700;background:var(--acc);color:var(--on);width:100%}.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn:disabled{opacity:.4}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:40;padding:20px}.dlg{background:var(--card);color:var(--ink);border-radius:16px;padding:20px;max-width:360px;width:100%}.row{display:flex;gap:10px}
.hero{text-align:center;padding:28px 0 8px}.score{font-size:22px}.score b{font-size:64px;line-height:1.1;color:var(--acc)}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 2px;text-align:center;font-size:12px}.sum b{display:block;font-size:24px}
.sum .ok b{color:var(--ok)}.sum .bad b{color:var(--bad)}.sum .pt b,.sum .sk b{color:var(--wn)}
.tabs{display:flex;gap:8px;margin:0 0 12px}.tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600}.tabs .on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.rv{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px}.rv.ok{border-left-color:var(--ok)}.rv.bad{border-left-color:var(--bad)}.rv.part,.rv.skip{border-left-color:var(--wn)}
.rv p{margin:6px 0 10px;font-weight:600}.rh{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}.rh span{font-weight:700;color:var(--ink)}
.ro{display:flex;gap:10px;padding:8px 10px;border-radius:8px;margin:4px 0;font-size:15px}.ro b{flex:none;width:20px}.ro span{flex:1}.ro i{font-style:normal;font-size:12px;font-weight:700;flex:none;max-width:96px;text-align:right}
.ro.ok,.mr div.ok{background:var(--okb);color:var(--ok)}.ro.bad,.mr div.bad{background:var(--badb);color:var(--bad)}
.mr{margin:8px 0}.mr div{padding:6px 10px;border-radius:8px;margin:3px 0;font-size:15px}.ex{margin-top:10px;font-size:14px;color:var(--mut)}
.lbl{display:block;font-weight:600;margin:18px 0 14px}.inp{display:block;width:100%;margin-top:6px;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit}.inp.err{border-color:var(--bad)}
.snd{margin-top:10px;font-size:14px;color:var(--mut)}.snd.ok{color:var(--ok);font-weight:600}.snd.bad{color:var(--bad);font-weight:600}
</style></head><body><div id="app"></div>
<script>
const Q=[{"n": 1, "q": "Жасуша мембранасы арқылы сұйық тамшылардың қармалауы", "ex": "Пиноцитоз — жасуша мембранасы арқылы сұйық тамшылардың қармалауы.", "o": [["A", "пиноцитоз"], ["B", "осмос"], ["C", "диффузия"], ["D", "фагоцитоз"]], "t": "s", "ans": "A"}, {"n": 2, "q": "Суретте 1-санымен көрсетілген мембрана құрылымы", "ex": "Фосфолипид — жасуша мембранасының негізгі қос қабатын (билипидті қабат) түзеді.", "o": [["A", "фосфолипид"], ["B", "олигосахарид"], ["C", "холестерол"], ["D", "интегралды нәруыз"]], "t": "s", "ans": "A", "img": "i1"}, {"n": 3, "q": "Қан айналым жүйесі бір шеңберлі", "ex": "Балықтардың қан айналым жүйесі бір шеңберлі, жүрегі екі қуысты.", "o": [["A", "жорғалаушылар"], ["B", "құстар"], ["C", "балықтар"], ["D", "қосмекенділер"]], "t": "s", "ans": "C"}, {"n": 4, "q": "Сыртқы құлаққа жатады", "ex": "Құлақ қалқаны мен сыртқы дыбыс жолы сыртқы құлаққа жатады.", "o": [["A", "төстік"], ["B", "ұлудене"], ["C", "құлақ қалқаны"], ["D", "үзеңгі"]], "t": "s", "ans": "C"}, {"n": 5, "q": "Тек жарықты қабылдайтын көру рецепторы", "ex": "Таяқшалар — ымыртта және тек жарықты (ақ-қара) қабылдайтын көру рецепторлары.", "o": [["A", "ақ қабық"], ["B", "құтыша"], ["C", "таяқша"], ["D", "соқыр дақ"]], "t": "s", "ans": "C"}, {"n": 6, "q": "Жиырылғыш нәруыз", "ex": "Миозин (актинмен бірге) — бұлшықет талшықтарының жиырылғыш нәруызы.", "o": [["A", "миозин"], ["B", "инсулин"], ["C", "тромбин"], ["D", "эластин"]], "t": "s", "ans": "A"}, {"n": 7, "q": "Суретте 2 санымен көрсетілген тістің типі", "ex": "Ит тіс (суретте 2 санымен күрек тістерден кейінгі үшкір тіс көрсетілген).", "o": [["A", "кіші азу тіс"], ["B", "күрек тіс"], ["C", "үлкен азу тіс"], ["D", "ит тіс"]], "t": "s", "ans": "D", "img": "i2"}, {"n": 8, "q": "Кребс цикліне енген ацетил-КоА қымыздықсірке қышқылымен қосылғанда түзіледі", "ex": "Кребс циклінде ацетил-КоА қымыздықсірке қышқылымен қосылып лимон қышқылын (цитрат) түзеді.", "o": [["A", "янтарь қышқылы"], ["B", "алма қышқылы"], ["C", "лимон қышқылы"], ["D", "фумар қышқылы"]], "t": "s", "ans": "C"}, {"n": 9, "q": "Суретте қан тамырлары мен жүйкелер көрсетілген тіс қабаты", "ex": "3 — пульпа (тіс жұмсағы), онда қан тамырлары мен жүйке талшықтары орналасқан.", "o": [["A", "4"], ["B", "1"], ["C", "3"], ["D", "2"]], "t": "s", "ans": "C", "img": "i3"}, {"n": 10, "q": "Берілген суреттегі байланыс түрі", "ex": "Сутектік байланыс — нәруыздың екінші реттік құрылымын (α-спираль) тұрақтандырады.", "o": [["A", "гликозидтік"], ["B", "сульфидтік"], ["C", "иондық"], ["D", "сутектік"]], "t": "s", "ans": "D", "img": "i4"}, {"n": 11, "q": "Кеңірдегінің ұшы тірі жасушаларды тесіп өтетін микроскопиялық құрылымға айналған ағза", "ex": "Жәндіктердің кеңірдек (трахея) ұштары (трахеолалар) тірі жасушаларға тікелей енеді.", "o": [["A", "балықтар"], ["B", "жәндіктер"], ["C", "құстар"], ["D", "құрттар"]], "t": "s", "ans": "B"}, {"n": 12, "q": "Эмбриогенездің негізгі сатыларының дұрыс реттілігі", "ex": "Эмбриогенез реттілігі: зигота → бөлшектену → бластула → гаструла → нейрула → органогенез.", "o": [["A", "зигота-бөлшектену-бластула-нейрула-гаструла-органогенез"], ["B", "зигота-бластула-бөлшектену-гаструла-нейрула-органогенез"], ["C", "зигота-бөлшектену-бластула-гаструла-нейрула-органогенез"], ["D", "зигота-бөлшектену-гаструла-бластула-нейрула-органогенез"]], "t": "s", "ans": "C"}, {"n": 13, "q": "Өсімдік спораларындағы хромосома жиынтығы", "ex": "Өсімдік споралары мейоз арқылы түзілетіндіктен хромосома жиынтығы гаплоидты (n).", "o": [["A", "триплоидты"], ["B", "гаплоидты"], ["C", "диплоидты"], ["D", "полиплоидты"]], "t": "s", "ans": "B"}, {"n": 14, "q": "Адамның тыныс алу жүйесінің орталық мүшесі", "ex": "Өкпе — адамның тыныс алу жүйесінің орталық (негізгі газ алмасу) мүшесі.", "o": [["A", "бронхы"], ["B", "өкпе"], ["C", "мұрын"], ["D", "көмей"]], "t": "s", "ans": "B"}, {"n": 15, "q": "Суреттегі Б бөлімінің ерекшелігі", "ex": "Б (флоэма / сүзгілі түтіктер) — органикалық заттарды жапырақтан тамырға және басқа мүшелерге өткізеді.", "o": [["A", "с const $=s=>document.querySelector(s),A=$('#app'),LS='bio-ubt-v1';

const nA=a=>a?(Array.isArray(a)?a.length:typeof a==='string'?1:Object.keys(a).length):0;
function grade(q,a){const m=mx(q);let p=0;
 if(q.t==='s')p=a===q.ans?1:0;
 else if(q.t==='m'){for(const k in q.ans)if(a&&a[k]===q.ans[k])p++}
 else if(a)p=a.filter(x=>q.ans.includes(x)).length;
 const st=!nA(a)?'skip':(p===m&&(q.t!=='x'||a.length===m))?'ok':p>0?'part':'bad';return{p,m,st}}
function showStart(){S.scr='start';A.innerHTML=`<h1>Биология</h1><p class=mut>ҰБТ форматындағы тест</p><div class=card><p><b>${Q.length} сұрақ · 40 минут · ең көбі ${MAX} ұпай</b></p><p class=mut>Бір дұрыс жауап — 1 ұпай. Сәйкестендіруде әр дұрыс жұп — 1 ұпай. Бірнеше жауапты тапсырмада әр дұрыс жауап — 1 ұпай (ең көбі 3 жауап таңдауға болады).</p><p class=mut>Уақыт бітсе, тест өздігінен аяқталады. Бет жаңарса, жауаптар сақталады.</p></div><label class=lbl>Аты-жөніңіз<input id=nm class=inp autocomplete=name placeholder="Тегі, аты" value="${e(S.name||'')}"></label><button class=btn data-a=start>Тестті бастау</button>`}
function start(){const n=$('#nm').value.trim();if(!n){const t=$('#nm');t.classList.add('err');t.placeholder='Атыңызды енгізіңіз';t.focus();return}
 try{localStorage.setItem('bio-ubt-name',n)}catch(x){}
 S={...S,name:n,scr:'test',i:0,a:{},st:Date.now(),end:Date.now()+2400000};save();showQ()}
function opts(q){const a=S.a[q.n];
 if(q.t==='m')return q.items.map(it=>`<div class=gt>${it.k}) ${e(it.t)}</div>`+q.o.map(([k,t])=>`<button class="opt${a&&a[it.k]===k?' sel':''}" data-a=m data-g=${it.k} data-k=${k}><b>${k}</b><span>${e(t)}</span></button>`).join('')).join('');
 return q.o.map(([k,t])=>`<button class="opt${(q.t==='s'?a===k:a&&a.includes(k))?' sel':''}" data-a=p data-k=${k}><b>${k}</b><span>${e(t)}</span></button>`).join('')}
function showQ(){const q=Q[S.i];
 A.innerHTML=`<div class=bar><span id=tm class=tm></span><span class=cnt id=cnt></span><button class=lnk data-a=fin>Аяқтау</button></div><div class=strip id=nav>${Q.map((x,i)=>`<button class=chip data-a=go data-i=${i}>${x.n}</button>`).join('')}</div><div class=card><div class=sec>${SEC(q.n)}</div>${q.ctx?`<details><summary>${e(q.ctx[0])}</summary><p>${e(q.ctx[1])}</p></details>`:''}<p class=qt>${q.n}. ${e(q.q)}</p>${q.img?`<div class=fig><img alt="Сурет" src="${IMG[q.img]}"></div>`:''}<div class=hint id=hint>${q.t==='x'?'Бір немесе бірнеше жауапты таңдаңыз (ең көбі 3)':q.t==='m'?'Әр жолға сәйкес жауапты таңдаңыз':''}</div><div id=opts></div></div><div class=foot><button class="btn ghost" id=pv data-a=prev>Алдыңғы</button><button class=btn id=nx data-a=next>Келесі</button></div>`;
 refresh();tick();scrollTo(0,0)}
function refresh(){const q=Q[S.i];$('#opts').innerHTML=opts(q);
 $('#cnt').textContent=`${S.i+1} / ${Q.length} · жауап: ${Object.keys(S.a).length}`;
 document.querySelectorAll('.chip').forEach((c,i)=>{c.classList.toggle('cur',i===S.i);c.classList.toggle('done',!!S.a[Q[i].n])});
 const c=$('.chip.cur'),n=$('#nav');n.scrollLeft=c.offsetLeft-n.clientWidth/2+c.offsetWidth/2;
 $('#pv').disabled=S.i===0;$('#nx').textContent=S.i===Q.length-1?'Аяқтау':'Келесі'}
function go(i){if(i<0||i>=Q.length)return;S.i=i;save();showQ()}
function pick(q,k,g){let a=S.a[q.n];
 if(q.t==='s')a=a===k?undefined:k;
 else if(q.t==='m'){a={...a};if(a[g]===k)delete a[g];else a[g]=k}
 else{a=[...(a||[])];const j=a.indexOf(k);if(j>=0)a.splice(j,1);else if(a.length<3)a.push(k);else{$('#hint').classList.add('wn');return}}
 if(nA(a))S.a[q.n]=a;else delete S.a[q.n];
 save();refresh()}
function ask(){const u=Q.length-Object.keys(S.a).length,d=document.createElement('div');d.className='ov';
 d.innerHTML=`<div class=dlg><p><b>Тестті аяқтайсыз ба?</b></p><p>${u?'Жауап берілмеген сұрақ: '+u+'.':'Барлық сұраққа жауап берілді.'}</p><div class=row><button class="btn ghost" data-a=close>Жалғастыру</button><button class=btn data-a=done>Аяқтау</button></div></div>`;document.body.append(d)}

function showRes(){let P=0;const c={ok:0,part:0,bad:0,skip:0};

 if(q.t==='m'){const t=Object.fromEntries(q.o);b=q.items.map(it=>{const u=a&&a[it.k],k=q.ans[it.k];return`<div class=mr><b>${it.k}) ${e(it.t)}</b><div class="${u===k?'ok':'bad'}">Сіздің жауабыңыз: ${u?u+') '+e(t[u]):'—'}</div>${u===k?'':`<div class=ok>Дұрыс жауабы: ${k}) ${e(t[k])}</div>`}</div>`}).join('')}

 return`<div class="rv ${g.st}"><div class=rh><span>№ ${q.n}</span><em>${lab} · ${g.p} / ${g.m} ұпай</em></div><p>${e(q.q)}</p>${q.img?`<div class=fig><img alt="Сурет" src="${IMG[q.img]}"></div>`:''}${b}${q.ex?`<div class=ex><b>Түсініктеме:</b> ${e(q.ex)}</div>`:''}</div>`}
